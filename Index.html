<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio-Guard: Quarantine Checkpoint</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #d4d4d4;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        #game-container {
            background-color: #2d2d2d;
            border: 4px solid #444;
            border-radius: 8px;
            padding: 20px;
            width: 450px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #555;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            background: #1e1e1e;
            padding: 8px;
            border-radius: 4px;
            font-weight: bold;
        }
        .booth {
            background: #222;
            border: 2px solid #ff5555;
            padding: 15px;
            margin: 15px 0;
            border-radius: 4px;
            min-height: 120px;
        }
        .button-zone {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
        }
        button {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-approve { background-color: #2ecc71; color: white; }
        .btn-deny { background-color: #e74c3c; color: white; }
        .btn-action { background-color: #3498db; color: white; }
        .btn-save { background-color: #f1c40f; color: black; width: 100%; margin-top: 10px;}
        button:hover { opacity: 0.9; }
        .log {
            background: #111;
            padding: 8px;
            height: 40px;
            font-size: 12px;
            color: #00ff00;
            overflow-y: auto;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="header">
        <h2>BORDER CONTROL: UNIT 04</h2>
        <div class="stats">
            <span>DAY: <span id="day-val">1</span></span>
            <span>CASH: $<span id="cash-val">0</span></span>
        </div>
    </div>

    <div class="log" id="system-log">System online. Next survivor approaching...</div>

    <div class="booth">
        <h4>SUBJECT DOCUMENTATION:</h4>
        <div id="subject-details">
            <!-- Loaded via JS -->
        </div>
    </div>

    <div class="button-zone">
        <button class="btn-action" onclick="useScanner()">RUN BIO-SCAN</button>
    </div>

    <div class="button-zone">
        <button class="btn-deny" onclick="processDecision(false)">DENY ENTRY</button>
        <button class="btn-approve" onclick="processDecision(true)">APPROVE ENTRY</button>
    </div>

    <button class="btn-save" onclick="saveGame()">MANUAL SAVE TO LOCALSTORAGE</button>
</div>

<script>
    // Game State variables
    let gameState = {
        day: 1,
        cash: 0,
        currentShiftPosition: 0
    };

    let currentSubject = {};

    // Generate random survivor profiles
    function generateSubject() {
        const names = ["John Doe", "Alex Smith", "Elena Rostova", "Marcus Vance", "Sasha Braus"];
        const reasons = ["Seeking medical refuge", "Looking for family", "Escaping the south sector", "I am completely healthy!"];
        
        const isInfected = Math.random() < 0.5;
        const hasForgedPapers = Math.random() < 0.3;

        currentSubject = {
            name: names[Math.floor(Math.random() * names.length)],
            reason: reasons[Math.floor(Math.random() * reasons.length)],
            idStatus: hasForgedPapers ? "EXPIRED / INVALID" : "VALID",
            bioStatus: isInfected ? "INFECTED (STAGE 1)" : "CLEAR",
            scanned: false,
            shouldDeny: isInfected || hasForgedPapers
        };

        renderSubject();
    }

    function renderSubject() {
        const html = `
            <p><strong>Name:</strong> ${currentSubject.name}</p>
            <p><strong>Reason:</strong> "${currentSubject.reason}"</p>
            <p><strong>Papers:</strong> ${currentSubject.idStatus}</p>
            <p><strong>Scanner Results:</strong> <span id="scan-res">${currentSubject.scanned ? currentSubject.bioStatus : "UNSCANNED"}</span></p>
        `;
        document.getElementById("subject-details").innerHTML = html;
    }

    function useScanner() {
        currentSubject.scanned = true;
        document.getElementById("scan-res").innerText = currentSubject.bioStatus;
        updateLog("Bio-scan complete. Look over the results closely.");
    }

    function processDecision(approved) {
        let correct = false;
        
        if (approved && !currentSubject.shouldDeny) correct = true;
        if (!approved && currentSubject.shouldDeny) correct = true;

        if (correct) {
            gameState.cash += 25;
            updateLog("Correct protocol followed! Earned $25.");
        } else {
            gameState.cash = Math.max(0, gameState.cash - 50);
            updateLog("PROTOCOL FAILURE! Infected or invalid entity processed.");
        }

        // Update UI counters
        document.getElementById("cash-val").innerText = gameState.cash;
        
        // Progress day sequence
        gameState.currentShiftPosition++;
        if(gameState.currentShiftPosition >= 3) {
            gameState.day++;
            gameState.currentShiftPosition = 0;
            document.getElementById("day-val").innerText = gameState.day;
            updateLog(`Day complete! Autosaving progress. Welcome to Day ${gameState.day}.`);
            autoSaveGame();
        }

        // Generate next survivor
        generateSubject();
    }

    function updateLog(message) {
        document.getElementById("system-log").innerText = message;
    }

    // Save and Load logic via LocalStorage
    function saveGame() {
        localStorage.setItem("checkpoint_save", JSON.stringify(gameState));
        updateLog("Game state saved successfully to LocalStorage!");
    }

    function autoSaveGame() {
        localStorage.setItem("checkpoint_save", JSON.stringify(gameState));
    }

    function loadGame() {
        const savedData = localStorage.getItem("checkpoint_save");
        if (savedData) {
            gameState = JSON.parse(savedData);
            document.getElementById("day-val").innerText = gameState.day;
            document.getElementById("cash-val").innerText = gameState.cash;
            updateLog(`Loaded save file: Day ${gameState.day} restored.`);
        } else {
            updateLog("No previous save data found. Starting fresh!");
        }
    }

    // Initialize Game on launch
    window.onload = function() {
        loadGame();
        generateSubject();
    };
</script>

</body>
</html>
