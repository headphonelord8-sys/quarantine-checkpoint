<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio-Guard 3D: Open Checkpoint</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; background-color: #050508; font-family: 'Courier New', monospace; user-select: none; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* Crosshair for First-Person looking */
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 6px; height: 6px;
            background: rgba(0, 255, 0, 0.5); border-radius: 50%;
            transform: translate(-50%, -50%); z-index: 5; pointer-events: none;
        }

        /* Instructions Overlay */
        #movement-instructions {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: #fff; padding: 10px 20px;
            border-radius: 5px; z-index: 10; font-size: 12px; pointer-events: none; text-align: center;
        }

        /* HUD & Desktop Interfaces */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box; }
        .interactive { pointer-events: auto; }
        
        .hud-header { display: flex; justify-content: space-between; background: rgba(15, 15, 15, 0.9); border: 2px solid #333; padding: 12px; color: #00ff00; border-radius: 4px; }
        
        /* Interactive Inspection Clipboard */
        #inspection-board {
            position: absolute; bottom: 30px; left: 30px; width: 320px;
            background: #f0e6c8; color: #111; padding: 15px; border-radius: 4px;
            box-shadow: 5px 5px 20px rgba(0,0,0,0.6); border: 2px solid #7a7156;
        }
        #inspection-board h3 { margin: 0 0 10px 0; font-size: 14px; border-bottom: 2px solid #444; color: #500; }
        #inspection-board p { margin: 5px 0; font-size: 12px; font-weight: bold; }
        .sickness-tag { display: inline-block; padding: 2px 6px; background: #d9534f; color: white; border-radius: 3px; font-size: 10px; margin: 2px; }

        /* Action Panel */
        .action-panel { position: absolute; bottom: 30px; right: 30px; display: flex; gap: 10px; }
        .btn { font-family: 'Courier New', monospace; font-weight: bold; padding: 12px 20px; border: 2px solid #444; border-radius: 4px; cursor: pointer; color: white; }
        .btn-approve { background: #27ae60; }
        .btn-deny { background: #c0392b; }
        .btn-settings { background: #555; position: absolute; top: 20px; right: 20px; }

        /* Settings Modal Screen */
        #settings-menu {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 300px; background: rgba(20,20,20,0.95); border: 3px solid #00ff00;
            padding: 30px; border-radius: 8px; z-index: 100; display: none; text-align: center;
            box-shadow: 0 0 30px rgba(0,255,0,0.2);
        }
        #settings-menu h2 { color: #00ff00; margin-top: 0; font-size: 20px; }
        .menu-btn { width: 100%; margin: 10px 0; padding: 10px; background: #333; color: white; border: 1px solid #555; cursor: pointer; font-family: 'Courier New', monospace; font-weight: bold; }
        .menu-btn:hover { background: #00ff00; color: black; }
        .close-settings { font-size: 11px; color: #aaa; cursor: pointer; text-decoration: underline; margin-top: 15px; display: inline-block; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="crosshair"></div>
<div id="canvas-container"></div>

<div id="movement-instructions">
    <strong>CLICK SCREEN TO LOCK MOUSE ACTION</strong><br>
    Move: [W, A, S, D] | Look: [Move Mouse]
</div>

<div id="ui-layer">
    <div class="hud-header">
        <div>SECURE BORDER STATION 04</div>
        <div>DAY: <span id="day-val">1</span> | CREDITS: $<span id="cash-val">0</span></div>
    </div>

    <button class="btn btn-settings interactive" onclick="toggleSettings(true)">⚙ SETTINGS</button>

    <div class="interactive" id="inspection-board">
        <h3>MEDICAL EXAMINATION LOG</h3>
        <p>SUBJECT: <span id="ui-name">Processing...</span></p>
        <p>DIAGNOSED CONDITION(S):</p>
        <div id="sickness-container">None</div>
    </div>

    <div class="action-panel interactive">
        <button class="btn btn-deny" onclick="submitDecision(false)">DENY CITIZEN</button>
        <button class="btn btn-approve" onclick="submitDecision(true)">APPROVE CITIZEN</button>
    </div>
</div>

<div id="settings-menu" class="interactive">
    <h2>SYSTEM CONFIGURATION</h2>
    <hr style="border-color:#333;">
    <button class="menu-btn" onclick="executeManualSave()">💾 COMMIT SAVE DATA</button>
    <button class="menu-btn" onclick="clearSaveData()">⚠ WIPE DATA FILES</button>
    <br>
    <span class="close-settings" onclick="toggleSettings(false)">Return to Checkpoint</span>
</div>

<script>
    // --- GAME INFRASTRUCTURE STATE ---
    let gameState = { day: 1, cash: 0, count: 0 };
    let currentSubject = {};

    // --- 3D ENGINE & PERSPECTIVE PLAYER CONTROLS ---
    let scene, camera, renderer;
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let velocity = new THREE.Vector3();
    let direction = new THREE.Vector3();
    let prevTime = performance.now();
    
    // Camera looking dynamics
    let pitchObject = new THREE.Object3D();
    let yawObject = new THREE.Object3D();
    const mouseSensitivity = 0.002;

    // 3D Visual References
    let citizenMesh;

    function init3DSpace() {
        const container = document.getElementById('canvas-container');
        
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x07070a);
        scene.fog = new THREE.FogExp2(0x07070a, 0.07);

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        // Construct First-Person Rig Assembly
        pitchObject.add(camera);
        yawObject.position.set(0, 2.5, 5); // Start standing up away from desk
        yawObject.add(pitchObject);
        scene.add(yawObject);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // Lighting Architecture
        scene.add(new THREE.AmbientLight(0x11111a));
        let topLight = new THREE.SpotLight(0xffffff, 2);
        topLight.position.set(0, 8, 2);
        scene.add(topLight);

        // Construct Environment Geometries
        // Floor Grid
        let floorGeo = new THREE.PlaneGeometry(30, 30);
        let floorMat = new THREE.MeshStandardMaterial({ color: 0x1f1f24, roughness: 0.8 });
        let floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Central Guard Control Desk
        let deskGeo = new THREE.BoxGeometry(4, 1.2, 1.5);
        let deskMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50 });
        let desk = new THREE.Mesh(deskGeo, deskMat);
        desk.position.set(0, 0.6, 1);
        scene.add(desk);

        // Call up initial character mesh positioning
        spawnCitizenModel();
        
        // Register PointerLock events for looking around smoothly
        container.addEventListener('click', () => {
            container.requestPointerLock();
        });

        document.addEventListener('mousemove', onMouseMove, false);
        document.addEventListener('keydown', onKeyDown, false);
        document.addEventListener('keyup', onKeyUp, false);
        window.addEventListener('resize', onResize, false);
    }

    // Generate physical 3D shapes to stack into a human figure
    function spawnCitizenModel() {
        if(citizenMesh) scene.remove(citizenMesh);

        citizenMesh = new THREE.Group();

        // Torso body element
        let torsoGeo = new THREE.CylinderGeometry(0.3, 0.4, 1.2, 8);
        let torsoMat = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff });
        let torso = new THREE.Mesh(torsoGeo, torsoMat);
        torso.position.y = 1.3;
        citizenMesh.add(torso);

        // Head element
        let headGeo = new THREE.SphereGeometry(0.22, 16, 16);
        let headMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
        let head = new THREE.Mesh(headGeo, headMat);
        head.position.y = 2.0;
        citizenMesh.add(head);

        // Position standing opposite side of the desk
        citizenMesh.position.set(0, 0, -0.5);
        scene.add(citizenMesh);
    }

    // --- CONTROL HANDLERS ---
    function onMouseMove(event) {
        if (document.pointerLockElement !== document.getElementById('canvas-container')) return;
        
        yawObject.rotation.y -= event.movementX * mouseSensitivity;
        pitchObject.rotation.x -= event.movementY * mouseSensitivity;
        pitchObject.rotation.x = Math.max(-Math.PI/2.5, Math.min(Math.PI/2.5, pitchObject.rotation.x));
    }

    function onKeyDown(e) {
        switch (e.code) {
            case 'KeyW': moveForward = true; break;
            case 'KeyS': moveBackward = true; break;
            case 'KeyA': moveLeft = true; break;
            case 'KeyD': moveRight = true; break;
        }
    }

    function onKeyUp(e) {
        switch (e.code) {
            case 'KeyW': moveForward = false; break;
            case 'KeyS': moveBackward = false; break;
            case 'KeyA': moveLeft = false; break;
            case 'KeyD': moveRight = false; break;
        }
    }

    function onResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // --- ANIMATION UPDATE LOOP ---
    function animate() {
        requestAnimationFrame(animate);

        // Physics Calculation for First-Person Walk Engine
        const time = performance.now();
        const delta = (time - prevTime) / 1000;

        velocity.x -= velocity.x * 10.0 * delta;
        velocity.z -= velocity.z * 10.0 * delta;

        direction.z = Number(moveForward) - Number(moveBackward);
        direction.x = Number(moveRight) - Number(moveLeft);
        direction.normalize();

        if (moveForward || moveBackward) velocity.z -= direction.z * 40.0 * delta;
        if (moveLeft || moveRight) velocity.x -= direction.x * 40.0 * delta;

        yawObject.translateX(velocity.x * delta);
        yawObject.translateZ(velocity.z * delta);

        // Keep character clamped to floor limits boundaries
        yawObject.position.y = 2.3; 
        yawObject.position.x = Math.max(-8, Math.min(8, yawObject.position.x));
        yawObject.position.z = Math.max(0.2, Math.min(12, yawObject.position.z));

        prevTime = time;
        renderer.render(scene, camera);
    }

    // --- DIAGNOSTIC HEALTH ENGINE ---
    function generateMedicalFile() {
        const names = ["Subject Alpha", "Subject Gamma", "Citizen 809", "Refugee 44", "Outpost Local"];
        
        // Expanded catalog of distinct biological mutations/sicknesses
        const possibleSicknesses = [
            "Necrotic Cell Decay", "T-Variant Fever", "Spore Lung Contamination", 
            "Parasitic Hive Attachment", "Ocular Bleeding Mutagen", "Advanced Nerve Paralysis"
        ];

        let activeSicknesses = [];
        // Determine arbitrary combinations of infections randomly
        possibleSicknesses.forEach(sickness => {
            if(Math.random() < 0.35) activeSicknesses.push(sickness);
        });

        currentSubject = {
            name: names[Math.floor(Math.random()*names.length)],
            sicknesses: activeSicknesses,
            shouldDeny: activeSicknesses.length > 0
        };

        // Render data elements into structural UI HUD layout
        document.getElementById("ui-name").innerText = currentSubject.name;
        
        const container = document.getElementById("sickness-container");
        if(currentSubject.sicknesses.length === 0) {
            container.innerHTML = `<span style="color:#27ae60;">HEALTHY / CLEAR TO ENTER</span>`;
        } else {
            container.innerHTML = currentSubject.sicknesses.map(s => `<span class="sickness-tag">${s}</span>`).join(" ");
        }

        spawnCitizenModel();
    }

    function submitDecision(approved) {
        let accurateResult = false;
        if(approved && !currentSubject.shouldDeny) accurateResult = true;
        if(!approved && currentSubject.shouldDeny) accurateResult = true;

        if(accurateResult) {
            gameState.cash += 50;
        } else {
            gameState.cash = Math.max(0, gameState.cash - 100);
            alert("CRITICAL WARNING: Processing Violation Issued!");
        }

        document.getElementById("cash-val").innerText = gameState.cash;
        gameState.count++;

        if(gameState.count >= 3) {
            gameState.day++;
            gameState.count = 0;
            document.getElementById("day-val").innerText = gameState.day;
            alert(`Shift concluded. Proceed to Settings panel to protect progress.`);
        }

        generateMedicalFile();
    }

    // --- SETTINGS MANAGEMENT CORE ---
    function toggleSettings(opened) {
        document.getElementById("settings-menu").style.display = opened ? "block" : "none";
        if(opened) {
            document.exitPointerLock();
        }
    }

    function executeManualSave() {
        localStorage.setItem("fps_checkpoint_save", JSON.stringify(gameState));
        alert("SYSTEM DATA SECURED: Progress locked manually.");
        toggleSettings(false);
    }

    function clearSaveData() {
        localStorage.removeItem("fps_checkpoint_save");
        alert("SYSTEM PURGED: Save data deleted.");
        location.reload();
    }

    function loadGameData() {
        const data = localStorage.getItem("fps_checkpoint_save");
        if(data) {
            gameState = JSON.parse(data);
            document.getElementById("day-val").innerText = gameState.day;
            document.getElementById("cash-val").innerText = gameState.cash;
        }
    }

    window.onload = function() {
        init3DSpace();
        animate();
        loadGameData();
        generateMedicalFile();
    };
</script>

</body>
</html>
